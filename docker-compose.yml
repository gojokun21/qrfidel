# Servicii locale pentru dezvoltare: docker compose up -d
services:
  # Aceeași versiune ca pe hosting (cPanel, MySQL 8.0.37) – vezi docs/decisions/020.
  mysql:
    image: mysql:8.0.37
    environment:
      MYSQL_DATABASE: creative_loyalty
      MYSQL_USER: loyalty
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    # Ca pe hosting: binlog oprit, deci userul aplicației (fără SUPER) poate crea triggerele append-only.
    command: ["--skip-log-bin"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uloyalty", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  redis-data:
